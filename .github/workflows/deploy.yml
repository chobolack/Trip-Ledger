name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 也可以在 Actions 頁面手動觸發一次。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；新的推送取代還在排隊的那個。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # 正常版＋惡搞版「野獸記帳」。後者蓋在 dist/inmuking/ 底下，
      # 順序不能反——見 frontend/vite.config.ts。
      - run: npm run build:all

      - uses: actions/upload-pages-artifact@v3
        with:
          # 這個路徑是相對於 repo 根目錄，不受上面的 working-directory 影響。
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
